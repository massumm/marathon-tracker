<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Group — RunMate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fff3ee 0%, #f5f6fa 60%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 36px 32px;
      box-shadow: 0 12px 48px rgba(255,107,53,.13); text-align: center;
      max-width: 360px; width: 92%;
    }
    .app-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .app-icon { width: 40px; height: 40px; border-radius: 10px; }
    .app-name { font-size: 18px; font-weight: 800; color: #1a202c; }
    h2 { font-size: 20px; font-weight: 800; color: #1a202c; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #718096; margin-bottom: 24px; }
    .qr-wrap {
      display: inline-block; padding: 16px;
      border: 2px solid rgba(255,107,53,.25); border-radius: 16px;
      margin-bottom: 20px; background: #fff;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px; border-radius: 14px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-decoration: none; margin-bottom: 10px; transition: opacity .15s;
    }
    .btn:active { opacity: .85; }
    .btn-primary { background: #FF6B35; color: #fff; }
    .btn-secondary { background: #f5f6fa; color: #1a202c; }
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 16px 0; }
    .hint { font-size: 11px; color: #b0b7c3; line-height: 1.6; }
    .steps { text-align: left; margin: 16px 0; }
    .step { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 13px; color: #4a5568; }
    .step-num {
      min-width: 22px; height: 22px; border-radius: 50%;
      background: #FF6B35; color: #fff; font-size: 11px;
      font-weight: 800; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-row">
      <img class="app-icon" src="/icon.png" alt="RunMate"/>
      <span class="app-name">RunMate</span>
    </div>

    <h2 id="title">Join Group</h2>
    <p class="sub">You've been invited to run together!</p>

    <!-- QR code rendered by JS -->
    <div class="qr-wrap">
      <div id="qr"></div>
    </div>

    <!-- Open in App (Android intent / iOS scheme) -->
    <a id="open-btn" class="btn btn-primary" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open in RunMate App
    </a>

    <hr class="divider"/>

    <p style="font-size:12px;font-weight:700;color:#4a5568;margin-bottom:10px;">Don't have the app? Scan the QR above with RunMate:</p>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><span>Open RunMate → tap the <b>Groups</b> button on any event</span></div>
      <div class="step"><div class="step-num">2</div><span>Tap the <b>scan icon</b> (top right)</span></div>
      <div class="step"><div class="step-num">3</div><span>Point at the QR code above — your request is sent!</span></div>
    </div>

    <a class="btn btn-secondary" href="/">
      Download RunMate
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('id') || '';
    const groupName = params.get('name') || 'the Group';
    const deepLink = 'marathon-map://group/' + groupId;

    // Update title
    document.getElementById('title').textContent = 'Join ' + groupName;

    // Generate QR code
    new QRCode(document.getElementById('qr'), {
      text: deepLink,
      width: 180,
      height: 180,
      colorDark: '#1a202c',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    // Set open-in-app href based on platform
    const openBtn = document.getElementById('open-btn');
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) {
      openBtn.href = 'intent://group/' + groupId +
        '#Intent;scheme=marathon-map;package=com.xor.runmate;end';
    } else {
      openBtn.href = deepLink;
    }
  </script>
</body>
</html>
